<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <!--
    Curvas de nivel procedurales. Franjas rectas deformadas por ruido
    fractal: el resultado son lazos cerrados de topografía, no un degradado.
    Se usa como MÁSCARA en CSS, así que solo importa el canal alfa —
    el color de las líneas lo pone la capa animada de globals.css.
  -->
  <defs>
    <pattern id="franjas" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="2.4" fill="#000"/>
    </pattern>

    <filter id="relieve" x="-35%" y="-35%" width="170%" height="170%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0019"
                    numOctaves="5" seed="23" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="340"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Sobredimensionado: el desplazamiento arrastra hasta ±170px y no
       queremos bordes vacíos dentro del viewBox. -->
  <rect x="-400" y="-400" width="2400" height="2400"
        fill="url(#franjas)" filter="url(#relieve)"/>
</svg>
